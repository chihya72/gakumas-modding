name: Release · gakumas_mi (Blender 插件)

# 触发：推送形如 gakumas-mi-v0.6.0 的 tag。
# 产物：用 tools/package_blender_addon.py 打出插件 zip 并建 GitHub Release。
# 版本号与游戏 mod 插件 3dmigoto-gkms 相互独立，不同步。

on:
  push:
    tags:
      - "gakumas-mi-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要全部 tag 来算 Full Changelog 的上一个版本

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 从 tag 提取版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME#gakumas-mi-v}" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 版本与插件源码一致
        run: |
          src=$(python - <<'PY'
          import re, pathlib
          t = pathlib.Path("gakumas_mi/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'"version"\s*:\s*\(([^)]*)\)', t)
          print(".".join(p.strip() for p in m.group(1).split(",") if p.strip()))
          PY
          )
          if [ "$src" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag 版本 ${{ steps.ver.outputs.version }} 与源码 bl_info 版本 $src 不一致"
            exit 1
          fi

      - name: 打包插件 zip
        run: python tools/package_blender_addon.py -o "dist/gakumas_mi-${{ steps.ver.outputs.version }}.zip"

      - name: 生成面向用户的 Release notes（tag 注解 + Full Changelog）
        run: |
          python - "${{ steps.ver.outputs.version }}" "$GITHUB_REF_NAME" > release_notes.md <<'PY'
          import subprocess, sys

          version, tag = sys.argv[1:]
          body = subprocess.check_output(
              ["git", "tag", "-l", "--format=%(contents)", tag],
              text=True,
          ).strip()
          lines = body.splitlines()
          theme = lines[0].strip() if lines else ""
          changes = "\n".join(lines[1:]).strip()
          if not theme or not changes or not any(
              line.lstrip().startswith("- ") for line in changes.splitlines()
          ):
              raise SystemExit(
                  "Blender Release tag 注解必须是：首行版本主题，空行后写面向用户的 '- ' 变更列表"
              )
          print(f"GakumasMI Blender 插件 **{version}** — {theme}\n")
          print("本版变动：")
          print(changes)
          PY
          # 上一个 gakumas-mi tag → Full Changelog 比较链接
          prev=$(git tag -l 'gakumas-mi-v*' --sort=-version:refname \
                 | awk -v cur="$GITHUB_REF_NAME" '$0==cur{getline; print; exit}')
          if [ -n "$prev" ]; then
            printf '\n\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "${{ github.server_url }}" "${{ github.repository }}" "$prev" "$GITHUB_REF_NAME" >> release_notes.md
          fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/gakumas_mi-${{ steps.ver.outputs.version }}.zip" \
            --title "GakumasMI Blender 插件 ${{ steps.ver.outputs.version }}" \
            --notes-file release_notes.md
